        /* =========================================
           CSS VARIABLES & RESET
           ========================================= */
        :root {
            --bg-primary: #0a0a0a;       /* Obsidian */
            --bg-secondary: #121212;     /* Charcoal */
            --text-primary: #f5f5f0;     /* Alabaster */
            --text-secondary: #a3a39e;   /* Muted Stone */
            --accent: #c5a059;           /* Muted Champagne Gold */
            --border: rgba(245, 245, 240, 0.1);
            
            --font-serif: 'Cormorant Garamond', serif;
            --font-sans: 'Inter', sans-serif;
            
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* =========================================
           UTILITY CLASSES
           ========================================= */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 5vw;
        }

        .section-label {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 2rem;
            display: block;
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.2s ease, transform 1.2s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================
           NAVIGATION
           ========================================= */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 2rem 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
            background: transparent;
        }

        header.scrolled {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            padding: 1.2rem 5vw;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        .logo span {
            color: var(--accent);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 3rem;
        }

        nav a {
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
            transition: var(--transition);
            position: relative;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent);
            transition: var(--transition);
        }

        nav a:hover::after {
            width: 100%;
        }
